ent:center;font-weight:750;font-size:17px}.bars{display:grid;gap:14px}.bar-row{display:grid;grid-template-columns:170px 1fr 42px;align-items:center;gap:12px;font-size:14px}.bar{height:9px;border-radius:8px;background:#edf0f5;overflow:hidden}.bar i{height:100%;display:block;background:#347be1;border-radius:8px}.map-grid{display:grid;grid-template-columns:1.35fr .8fr;gap:16px}.map-panel{min-height:520px;position:relative}.map-panel .india-map{width:100%;height:450px}.state-list{display:grid;gap:18px}.state-row{display:grid;grid-template-columns:150px 1fr 42px;gap:12px;align-items:center}.state-row .bar{height:11px}.state-row .bar i{background:#ee4c52}.keylist{display:grid;gap:12px}.keylist div{display:flex;gap:12px;align-items:center}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar select{padding:10px;border:1px solid var(--line);border-radius:20px;background:white}.modal-back{position:fixed;inset:0;background:#101a3566;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-back.show{display:flex}.modal{background:white;border-radius:18px;padding:24px;width:min(540px,100%);box-shadow:0 15px 60px #101a3540}.modal h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{font-size:13px;color:#566178;display:grid;gap:6px}.form-grid input,.form-grid select{border:1px solid var(--line);border-radius:9px;padding:11px;width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 16px}.toast{position:fixed;bottom:22px;right:22px;background:#15233e;color:#fff;padding:13px 18px;border-radius:12px;display:none;z-index:40;box-shadow:0 8px 30px #0002}.toast.show{display:block}.report-grid,.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.report-card{padding:22px;border:1px solid var(--line);border-radius:16px}.report-card .big{font-size:32px;font-weight:750;margin:12px 0}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.toggle{width:44px;height:24px;border-radius:20px;background:#d9dfeb;position:relative;border:0}.toggle:after{content:"";width:18px;height:18px;background:#fff;position:absolute;top:3px;left:3px;border-radius:50%;transition:.2s}.toggle.on{background:#2368d4}.toggle.on:after{left:23px}
@media(max-width:1100px){.app{grid-template-columns:190px 1fr}.sidebar{padding-inline:8px}.stats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:52px}.dashboard-grid,.insights-grid,.map-grid{grid-template-columns:1fr}.lower-grid{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}.sidebar{height:auto;min-height:0;position:relative;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:4px 0 10px}.emblem,.sidebar-bottom{display:none}.brand h2{font-size:23px}.nav{display:flex;overflow:auto;gap:5px}.nav button{padding:10px 12px;white-space:nowrap;font-size:13px;gap:7px}.nav button .ico{font-size:17px;width:auto}.nav button.active{box-shadow:inset 0 -3px #2367d5}.topbar{height:76px;gap:8px}.global-search{height:42px}.top-actions{gap:8px}.pill-select{padding:9px;font-size:12px}.profile{display:none}main{padding:0 14px 25px}.page-head h1{font-size:30px}.page-head p{font-size:14px}.hero{min-height:100px}.hero h1{font-size:42px}.hero p{font-size:17px}.hero-art{font-size:55px;padding:0}.stats{gap:9px}.stat{padding:12px;min-height:100px;gap:9px}.stat-icon{width:42px;height:42px;flex-basis:42px;font-size:20px}.stat strong{font-size:21px}.stat span{font-size:12px}.trend{font-size:12px;margin-top:5px}.panel{padding:14px}.project-mini{grid-template-columns:70px 1fr;gap:10px}.project-mini .status{grid-column:2;justify-self:start}.thumb{height:56px}.filters input{min-width:100%;flex-basis:100%}.filters select{flex:1;min-width:0}.reset{margin-left:0}.report-grid,.settings-grid,.form-grid{grid-template-columns:1fr}.bar-row{grid-template-columns:110px 1fr 35px;font-size:12px}.state-row{grid-template-columns:100px 1fr 35px;font-size:12px}.map-panel{min-height:390px}.map-panel .india-map{height:340px}.table-foot{min-width:700px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="emblem">♛</div><h2>LandSetu</h2><p>Predict · Plan · Prevent</p></div>
  <nav class="nav" id="nav">
    <button data-page="dashboard" class="active"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="projects"><span class="ico">▣</span>Projects</button>
    <button data-page="insights"><span class="ico">✣</span>AI Insights</button>
    <button data-page="map"><span class="ico">◫</span>Map</button>
    <button data-page="reports"><span class="ico">▤</span>Reports</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
  </nav>
  <div class="sidebar-bottom"><div class="monument">♜</div><b>Smarter Land<br>Stronger India</b><div class="tricolor"></div></div>
</aside>
<main>
<header class="topbar">
  <div class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Search projects..."></div>
  <div class="top-actions"><select class="pill-select" id="region"><option>All India</option><option>North India</option><option>West India</option><option>South India</option><option>East India</option></select><button class="icon-btn" id="notify" title="Notifications">♧<i class="dot"></i></button><div class="profile"><div class="avatar">👨🏻</div><div><b>Amit Sharma　⌄</b><small>National Admin</small></div></div></div>
</header>
<section id="content"></section>
</main>
</div>
<div class="modal-back" id="modal"><div class="modal"><h2>Add New Project</h2><form id="projectForm"><div class="form-grid">
<label>Project name<input name="name" required placeholder="Enter project name"></label>
<label>Project ID<input name="id" placeholder="PRJ-001239"></label>
<label>State<input name="state" required placeholder="State"></label>
<label>District<input name="district" required placeholder="District"></label>
<label>Status<select name="status"><option>In Progress</option><option>On Track</option><option>At Risk</option></select></label>
<label>Risk level<select name="risk"><option>Low</option><option>Medium</option><option>High</option></select></label>
<label>Progress (%)<input name="progress" type="number" min="0" max="100" value="0"></label>
<label>Expected date<input name="date" type="month" value="2027-03"></label>
</div><div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary">Save Project</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
const projects=[
{name:'Delhi-Mumbai Expressway',id:'PRJ-001234',state:'Maharashtra',district:'Nagpur',status:'In Progress',risk:'High',progress:68,date:'Dec 2026',symbol:'🛣️'},
{name:'Metro Corridor Phase-2',id:'PRJ-001235',state:'Delhi',district:'New Delhi',status:'On Track',risk:'Low',progress:82,date:'Nov 2026',symbol:'🚆'},
{name:'Rural Connectivity Project',id:'PRJ-001236',state:'Uttar Pradesh',district:'Lucknow',status:'At Risk',risk:'Medium',progress:54,date:'Jan 2027',symbol:'🌉'},
{name:'Smart City Expansion',id:'PRJ-001237',state:'Gujarat',district:'Ahmedabad',status:'In Progress',risk:'Medium',progress:73,date:'Feb 2027',symbol:'🏙️'},
{name:'Highway Widening Project',id:'PRJ-001238',state:'Rajasthan',district:'Jaipur',status:'On Track',risk:'Low',progress:80,date:'Dec 2026',symbol:'🚧'},
{name:'Coastal Rail Link',id:'PRJ-001239',state:'Tamil Nadu',district:'Chennai',status:'At Risk',risk:'High',progress:42,date:'Apr 2027',symbol:'🚄'},
{name:'Greenfield Airport',id:'PRJ-001240',state:'Karnataka',district:'Bengaluru',status:'In Progress',risk:'Medium',progress:61,date:'May 2027',symbol:'✈️'},
{name:'Irrigation Modernisation',id:'PRJ-001241',state:'Madhya Pradesh',district:'Bhopal',status:'On Track',risk:'Low',progress:91,date:'Oct 2026',symbol:'💧'}
];
let page='dashboard',pageNo=1,filters={q:'',state:'',district:'',status:'',risk:''};
const $=s=>document.querySelector(s);
function statusClass(s){return s==='At Risk'?'risk':s==='On Track'?'track':''}
function statCards(items=projects){return `<div class="stats">
<div class="stat"><div class="stat-icon">▰</div><div><strong>1,248</strong><span>Total Projects</span><div class="trend">↑ 12%</div></div></div>
<div class="stat"><div class="stat-icon green">✓</div><div><strong>892</strong><span>On Track</span><div class="trend green">↑ 8%</div></div></div>
<div class="stat"><div class="stat-icon orange">⚠</div><div><strong>226</strong><span>At Risk</span><div class="trend orange">↑ 5%</div></div></div>
<div class="stat"><div class="stat-icon red">!</div><div><strong>130</strong><span>Critical Delay</span><div class="trend red">↑ 2%</div></div></div></div>`}
function indiaSvg(){return `<svg class="india-map" viewBox="0 0 330 390" role="img" aria-label="Stylised map of India"><path d="M83 15 118 7 143 21 174 14 190 37 222 43 218 68 242 81 225 105 245 125 224 148 237 169 216 191 211 220 193 243 183 273 165 304 147 339 130 374 112 346 102 317 86 289 76 258 56 237 49 209 31 187 43 161 25 138 38 115 28 91 47 72 45 48 66 43Z" fill="#eaf1fc" stroke="#c8d6ed" stroke-width="2"/><path d="m38 115 37-8 18 24-10 32-28 12-25-15Z" fill="#8db8f4"/><path d="m92 128 42-18 31 19-7 36-41 15-29-20Z" fill="#b8d1f6"/><path d="m169 130 43-13 26 24-15 31-39 2-23-20Z" fill="#7eacf0"/><path d="m78 184 43-8 31 24-14 38-35 4-28-25Z" fill="#286ed0"/><path d="m143 183 44-13 28 30-15 38-43 7-22-29Z" fill="#b7cff2"/><path d="m103 244 42-10 31 23-17 39-24 35-21-37Z" fill="#7eacf0"/><path d="m181 246 23-14 16 24-17 35-17-17Z" fill="#d2e1f8"/><path d="m214 84 23-8 18 19-15 21-20-7Z" fill="#d5e3f8"/><path d="m43 73 21-18 23 8-5 24-27 10Z" fill="#c1d7f6"/><path d="m248 149 18 12-4 28-12 13-8-27Z" fill="#dce8f9"/><path d="m161 337 12 15-8 22-13-12Z" fill="#dce8f9"/></svg>`}
function recentRows(){return projects.slice(0,3).map((p,i)=>`<div class="project-mini"><div class="thumb">${p.symbol}</div><div><b>${p.name}</b><small>${p.state}</small></div><span class="status ${statusClass(p.status)}">${p.status}</span></div>`).join('')}
function dashboard(){return `<div class="hero"><div><h1>LandSetu</h1><p>Predict · Plan · Prevent</p></div><div class="hero-art">🏛️</div></div>${statCards()}<div class="dashboard-grid"><div class="panel"><h3><span class="mini">♧</span>India Land Acquisition Risk</h3><div class="india-wrap">${indiaSvg()}<div class="legend"><span><i class="dotkey" style="background:#1557c0"></i>High</span><span><i class="dotkey" style="background:#70a4ed"></i>Medium</span><span><i class="dotkey" style="background:#c6d9f7"></i>Low</span></div></div></div><div class="panel"><h3>▥　Recent Projects <a href="#" onclick="go('projects');return false" style="float:right;color:#1557c0;font-size:15px;text-decoration:none">View All →</a></h3>${recentRows()}</div></div>`}
function filtered(){return projects.filter(p=>(!filters.q||(p.name+' '+p.id).toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.state||p.state===filters.state)&&(!filters.district||p.district===filters.district)&&(!filters.status||p.status===filters.status)&&(!filters.risk||p.risk===filters.risk))}
function projectTable(){let all=filtered(),rows=all.slice((pageNo-1)*5,pageNo*5);return `<div class="page-head"><div><h1>Projects</h1><p>Manage and track all land acquisition projects</p></div><button class="primary" id="addProject">＋ Add Project</button></div>${statCards()}<div class="filters"><input id="projectSearch" placeholder="⌕  Search by project name or ID..." value="${filters.q}"><select id="stateFilter"><option value="">All States</option>${[...new Set(projects.map(p=>p.state))].map(s=>`<option ${filters.state===s?'selected':''}>${s}</option>`).join('')}</select><select id="districtFilter"><option value="">All Districts</option>${[...new Set(projects.map(p=>p.district))].map(s=>`<option ${filters.district===s?'selected':''}>${s}</option>`).join('')}</select><select id="statusFilter"><option value="">All Status</option>${['On Track','In Progress','At Risk'].map(s=>`<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}</select><select id="riskFilter"><option value="">All Risk Level</option>${['Low','Medium','High'].map(s=>`<option ${filters.risk===s?'selected':''}>${s}</option>`).join('')}</select><button class="reset" id="reset">⟳ Reset</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>Project Name</th><th>State</th><th>District</th><th>Status</th><th>Risk Level</th><th>Progress</th><th>Expected Date</th><th>Actions</th></tr></thead><tbody>${rows.map((p,i)=>`<tr><td>${(pageNo-1)*5+i+1}</td><td><strong>${p.name}</strong><small>${p.id}</small></td><td>${p.state}</td><td>${p.district}</td><td><span class="status ${statusClass(p.status)}">${p.status}</span></td><td><span class="status ${p.risk==='High'?'risk':p.risk==='Medium'?'medium':'track'}">${p.risk}</span></td><td>${p.progress}%<div class="progress"><i style="width:${p.progress}%"></i></div></td><td>▦　${p.date}</td><td><button class="view" onclick="viewProject('${p.id}')">View</button>　<button class="view" onclick="removeProject('${p.id}')" title="Delete">⋮</button></td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;padding:35px">No projects match your filters.</td></tr>'}</tbody></table><div class="table-foot"><span>Showing ${all.length?((pageNo-1)*5+1):0}–${Math.min(pageNo*5,all.length)} of ${all.length} projects</span><div class="pages"><button onclick="changePage(-1)">‹</button><button class="active">${pageNo}</button><button onclick="changePage(1)">${pageNo+1}</button><button onclick="changePage(1)">›</button></div></div></div>`}
function insights(){return `<div class="page-head"><div><h1>AI Insights</h1><p>Smart insights for better land acquisition decisions</p></div><select class="pill-select"><option>Last 6 Months</option><option>Last 30 Days</option><option>Last Year</option></select></div><div class="stats"><div class="stat"><div class="stat-icon">♧</div><div><strong>78%</strong><span>Overall Risk Score</span><div class="trend green">↓ 8%</div></div></div><div class="stat"><div class="stat-icon green">◷</div><div><strong>92 Days</strong><span>Avg Predicted Delay</span><div class="trend green">↓ 12%</div></div></div><div class="stat"><div class="stat-icon orange">⚠</div><div><strong>124</strong><span>High-Risk Projects</span><div class="trend orange">↓ 6%</div></div></div><div class="stat"><div class="stat-icon red">✓</div><div><strong>86%</strong><span>Prediction Accuracy</span><div class="trend red">↑ 2%</div></div></div></div><div class="insights-grid"><div class="panel"><h3>▥　Risk Trend <small style="float:right;color:#64718a;font-size:12px">● Risk Score　● Target (&lt;70%)</small></h3><svg class="chart" viewBox="0 0 600 230"><g stroke="#e9edf4"><path d="M50 20H580M50 70H580M50 120H580M50 170H580"/></g><g fill="#667188" font-size="12"><text x="6" y="24">100%</text><text x="14" y="74">75%</text><text x="14" y="124">50%</text><text x="14" y="174">25%</text><text x="15" y="218">0%</text></g><path d="M50 55 L150 62 L250 71 L350 72 L450 74 L550 76 L550 190 L50 190Z" fill="#dceaff" opacity=".55"/><polyline points="50,55 150,62 250,71 350,72 450,74 550,76" fill="none" stroke="#2876df" stroke-width="3"/><g fill="white" stroke="#2876df" stroke-width="3"><circle cx="50" cy="55" r="5"/><circle cx="150" cy="62" r="5"/><circle cx="250" cy="71" r="5"/><circle cx="350" cy="72" r="5"/><circle cx="450" cy="74" r="5"/><circle cx="550" cy="76" r="5"/></g><g fill="#344057" font-size="13"><text x="42" y="214">Jun</text><text x="140" y="214">Jul</text><text x="240" y="214">Aug</text><text x="340" y="214">Sep</text><text x="440" y="214">Oct</text><text x="540" y="214">Nov</text></g><text x="520" y="39" fill="#1557c0" font-size="20" font-weight="bold">78%</text></svg></div><div class="panel"><h3>♧　Key Insights</h3><div class="insight-row"><div class="insight-icon">⚠️</div><div><b>124 projects are at high risk</b><small>Focus on compensation and legal clearances.</small></div></div><div class="insight-row"><div class="insight-icon" style="background:#e9f8f0">↗</div><div><b>Delay risk reduced by 12%</b><small>Due to faster approvals in 3 states.</small></div></div><div class="insight-row"><div class="insight-icon" style="background:#edf4ff">ⓘ</div><div><b>Maharashtra has highest risk</b><small>34% of state projects are at risk.</small></div></div></div></div><div class="lower-grid"><div class="panel"><h3>◉　Risk Distribution</h3><div class="donut-area"><div class="donut"></div><div class="legend"><span>🟢 Low Risk　52%</span><span>🟠 Medium Risk　32%</span><span>🔴 High Risk　16%</span></div></div></div><div class="panel"><h3>▦　Explainable AI – Top Risk Factors</h3><div class="bars">${[['Pending Compensation',34],['Legal Disputes',27],['Approval Delays',22],['Documentation Issues',11],['Other Factors',6]].map(([n,v])=>`<div class="bar-row"><span>${n}</span><div class="bar"><i style="width:${v*2.8}%"></i></div><b>${v}%</b></div>`).join('')}</div></div></div>`}
function mapPage(){return `<div class="page-head"><div><h1>LandSetu Map</h1><p>Explore land acquisition risk across India</p></div></div>${statCards()}<div class="map-grid"><div class="panel map-panel"><h3>♧　India Risk Map <span class="toolbar" style="float:right"><select id="mapRisk"><option>Risk Level</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select><select><option>All States</option><option>Maharashtra</option><option>Uttar Pradesh</option></select></span></h3><div class="india-wrap">${indiaSvg()}<div class="legend"><span>🔴 Critical</span><span>🟠 High</span><span>🩷 Medium</span><span>⚪ Low</span></div></div></div><div><div class="panel"><h3>▥　State Risk Overview <a href="#" onclick="toast('Showing all state risk records');return false" style="float:right;color:#1557c0;text-decoration:none;font-size:14px">View All →</a></h3><div class="state-list">${[['Maharashtra',92],['Uttar Pradesh',78],['Madhya Pradesh',65],['Rajasthan',48],['Gujarat',40]].map(([s,v])=>`<div class="state-row"><span>${s}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}%</b></div>`).join('')}</div></div><div class="panel" style="margin-top:16px"><h3>♧　Key Insights</h3><div class="keylist"><div>🔴 Maharashtra has the highest risk (92% probability).</div><div>🔵 Land acquisition in 3 states may face delays in next 3 months.</div><div>🟢 82% projects are on track nationwide.</div></div></div></div></div>`}
function reports(){return `<div class="page-head"><div><h1>Reports</h1><p>Generate and review land acquisition performance reports</p></div><button class="primary" onclick="downloadReport()">↓ Export Report</button></div><div class="report-grid"><div class="report-card"><span>📊 Project Overview</span><div class="big">1,248</div><small>Projects tracked nationwide</small><p><button class="view" onclick="downloadReport()">Download CSV</button></p></div><div class="report-card"><span>⚠️ Risk Assessment</span><div class="big">78%</div><small>Overall risk score</small><p><button class="view" onclick="downloadReport()">Download CSV</button></p></div><div class="report-card"><span>🗓️ Timeline Report</span><div class="big">92 days</div><small>Average predicted delay</small><p><button class="view" onclick="downloadReport()">Download CSV</button></p></div><div class="report-card"><span>📍 State-wise Summary</span><div class="big">28 States</div><small>Coverage across India</small><p><button class="view" onclick="downloadReport()">Download CSV</button></p></div></div>`}
function settings(){return `<div class="page-head"><div><h1>Settings</h1><p>Manage your account and platform preferences</p></div></div><div class="settings-grid"><div class="panel"><h3>Profile Settings</h3><div class="settings-row"><span><b>Amit Sharma</b><br><small>National Admin</small></span><button class="view" onclick="toast('Profile settings opened')">Edit</button></div><div class="settings-row"><span>Email notifications</span><button class="toggle on" onclick="this.classList.toggle('on')"></button></div><div class="settings-row"><span>Weekly project summary</span><button class="toggle on" onclick="this.classList.toggle('on')"></button></div><div class="settings-row"><span>AI risk alerts</span><button class="toggle on" onclick="this.classList.toggle('on')"></button></div></div><div class="panel"><h3>Platform Preferences</h3><div class="settings-row"><span>Default region</span><select class="pill-select"><option>All India</option><option>North India</option><option>South India</option></select></div><div class="settings-row"><span>Language</span><select class="pill-select"><option>English</option><option>हिन्दी</option></select></div><div class="settings-row"><span>Compact dashboard</span><button class="toggle" onclick="this.classList.toggle('on')"></button></div></div></div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#content').innerHTML=({dashboard,projects:projectTable,insights,map:mapPage,reports,settings}[page])();if(page==='projects')bindProjectFilters();if(page==='projects')$('#addProject').onclick=openModal}
function go(p){page=p;render();window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function bindProjectFilters(){[['projectSearch','q'],['stateFilter','state'],['districtFilter','district'],['statusFilter','status'],['riskFilter','risk']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{filters[k]=e.target.value;pageNo=1;const pos=window.scrollY;render();window.scrollTo(0,pos)}));$('#reset').onclick=()=>{filters={q:'',state:'',district:'',status:'',risk:''};pageNo=1;render()}}
function changePage(n){pageNo=Math.max(1,Math.min(Math.ceil(filtered().length/5)||1,pageNo+n));render()}
function openModal(){$('#modal').classList.add('show')}
$('#cancel').onclick=()=>$('#modal').classList.remove('show');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
$('#projectForm').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));projects.unshift({name:d.name,id:d.id||'PRJ-'+String(Date.now()).slice(-6),state:d.state,district:d.district,status:d.status,risk:d.risk,progress:+d.progress,date:d.date,symbol:'🏗️'});$('#modal').classList.remove('show');e.target.reset();filters={q:'',state:'',district:'',status:'',risk:''};pageNo=1;render();toast('Project added successfully')});
function viewProject(id){let p=projects.find(x=>x.id===id);toast(`${p.name} · ${p.progress}% complete · ${p.risk} risk`)}
function removeProject(id){if(confirm('Remove this project from the demo list?')){let i=projects.findIndex(p=>p.id===id);if(i>-1)projects.splice(i,1);render();toast('Project removed')}}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2600)}
function downloadReport(){let csv='Project,ID,State,District,Status,Risk,Progress,Expected Date\\n'+projects.map(p=>[p.name,p.id,p.state,p.district,p.status,p.risk,p.progress+'%',p.date].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='landsetu-project-report.csv';a.click();URL.revokeObjectURL(a.href);toast('Report exported')}
$('#notify').onclick=()=>toast('You are all caught up — no new notifications.');
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){filters.q=e.target.value;go('projects')}});
render();
</script>
</body></html>
