eight:750;font-size:17px}.bars{display:grid;gap:14px}.bar-row{display:grid;grid-template-columns:170px 1fr 42px;align-items:center;gap:12px;font-size:14px}.bar{height:9px;border-radius:8px;background:#edf0f5;overflow:hidden}.bar i{height:100%;display:block;background:#347be1;border-radius:8px}.map-grid{display:grid;grid-template-columns:1.35fr .8fr;gap:16px}.map-panel{min-height:520px;position:relative}.map-panel .india-map{width:100%;height:450px}.state-list{display:grid;gap:18px}.state-row{display:grid;grid-template-columns:150px 1fr 42px;gap:12px;align-items:center}.state-row .bar{height:11px}.state-row .bar i{background:#ee4c52}.keylist{display:grid;gap:12px}.keylist div{display:flex;gap:12px;align-items:center}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar select{padding:10px;border:1px solid var(--line);border-radius:20px;background:white}.modal-back{position:fixed;inset:0;background:#101a3566;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-back.show{display:flex}.modal{background:white;border-radius:18px;padding:24px;width:min(540px,100%);box-shadow:0 15px 60px #101a3540}.modal h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{font-size:13px;color:#566178;display:grid;gap:6px}.form-grid input,.form-grid select{border:1px solid var(--line);border-radius:9px;padding:11px;width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 16px}.toast{position:fixed;bottom:22px;right:22px;background:#15233e;color:#fff;padding:13px 18px;border-radius:12px;display:none;z-index:40;box-shadow:0 8px 30px #0002}.toast.show{display:block}.report-grid,.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.report-card{padding:22px;border:1px solid var(--line);border-radius:16px}.report-card .big{font-size:32px;font-weight:750;margin:12px 0}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.toggle{width:44px;height:24px;border-radius:20px;background:#d9dfeb;position:relative;border:0}.toggle:after{content:"";width:18px;height:18px;background:#fff;position:absolute;top:3px;left:3px;border-radius:50%;transition:.2s}.toggle.on{background:#2368d4}.toggle.on:after{left:23px}
@media(max-width:1100px){.app{grid-template-columns:190px 1fr}.sidebar{padding-inline:8px}.stats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:52px}.dashboard-grid,.insights-grid,.map-grid{grid-template-columns:1fr}.lower-grid{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}.sidebar{height:auto;min-height:0;position:relative;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:4px 0 10px}.emblem,.sidebar-bottom{display:none}.brand h2{font-size:23px}.nav{display:flex;overflow:auto;gap:5px}.nav button{padding:10px 12px;white-space:nowrap;font-size:13px;gap:7px}.nav button .ico{font-size:17px;width:auto}.nav button.active{box-shadow:inset 0 -3px #2367d5}.topbar{height:76px;gap:8px}.global-search{height:42px}.top-actions{gap:8px}.pill-select{padding:9px;font-size:12px}.profile{display:none}main{padding:0 14px 25px}.page-head h1{font-size:30px}.page-head p{font-size:14px}.hero{min-height:100px}.hero h1{font-size:42px}.hero p{font-size:17px}.hero-art{font-size:55px;padding:0}.stats{gap:9px}.stat{padding:12px;min-height:100px;gap:9px}.stat-icon{width:42px;height:42px;flex-basis:42px;font-size:20px}.stat strong{font-size:21px}.stat span{font-size:12px}.trend{font-size:12px;margin-top:5px}.panel{padding:14px}.project-mini{grid-template-columns:70px 1fr;gap:10px}.project-mini .status{grid-column:2;justify-self:start}.thumb{height:56px}.filters input{min-width:100%;flex-basis:100%}.filters select{flex:1;min-width:0}.reset{margin-left:0}.report-grid,.settings-grid,.form-grid{grid-template-columns:1fr}.bar-row{grid-template-columns:110px 1fr 35px;font-size:12px}.state-row{grid-template-columns:100px 1fr 35px;font-size:12px}.map-panel{min-height:390px}.map-panel .india-map{height:340px}.table-foot{min-width:700px}}

</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="emblem">♛</div><h2>LandSetu</h2><p>Predict · Plan · Prevent</p></div>
  <nav class="nav" id="nav">
    <button data-page="dashboard" class="active"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="projects"><span class="ico">▣</span>Projects</button>
    <button data-page="insights"><span class="ico">✣</span>Project Insights</button>
    <button data-page="map"><span class="ico">◫</span>Map</button>
    <button data-page="reports"><span class="ico">▤</span>Reports</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
  </nav>
  <div class="sidebar-bottom"><div class="monument">♜</div><b>Smarter Land<br>Stronger India</b><div class="tricolor"></div></div>
</aside>
<main>
<header class="topbar">
  <div class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Search projects..."></div>
  <div class="top-actions"><select class="pill-select" id="region"><option>All India</option><option>North India</option><option>West India</option><option>South India</option><option>East India</option></select><button class="icon-btn" id="notify" title="Notifications">♧<i class="dot"></i></button><div class="profile"><div class="avatar">U</div><div><b>Account</b><small>Signed in</small></div></div></div>
</header>
<section id="content"></section>
</main>
</div>
<div class="modal-back" id="modal"><div class="modal"><h2>Add New Project</h2><form id="projectForm"><input type="hidden" name="recordId"><div class="form-grid">
<label>Project name<input name="name" required placeholder="Enter project name"></label>
<label>Project ID<input name="id" placeholder="PRJ-001239"></label>
<label>State<input name="state" required placeholder="State"></label>
<label>District<input name="district" required placeholder="District"></label>
<label>Status<select name="status"><option>In Progress</option><option>On Track</option><option>At Risk</option><option>Completed</option><option>On Hold</option></select></label>
<label>Risk level<select name="risk"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label>
<label>Progress (%)<input name="progress" type="number" min="0" max="100" value="0"></label>
<label>Expected date<input name="date" type="month"></label>
</div><div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" class="primary">Save Project</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
let projects=[];
let currentUser=null,supabaseClient=null,profileData=null;
let page='dashboard',pageNo=1,filters={q:'',state:'',district:'',status:'',risk:''};
const $=s=>document.querySelector(s);
function statusClass(s){return s==='At Risk'||s==='Critical'?'risk':s==='On Track'||s==='Completed'?'track':s==='On Hold'?'medium':''}
function formatProject(row){
 const date=row.expected_completion?new Date(row.expected_completion+'T00:00:00'):null;
 return {dbId:row.id,id:row.project_code||row.id,name:row.name,state:row.state,district:row.district,status:row.status,risk:row.risk_level,progress:Number(row.progress)||0,date:date?date.toLocaleDateString('en-IN',{month:'short',year:'numeric'}):'—',dateValue:row.expected_completion?row.expected_completion.slice(0,7):'',symbol:'🏗️'};
}
async function loadProjects(){
 if(!supabaseClient||!currentUser)return;
 const {data,error}=await supabaseClient.from('projects').select('*').order('created_at',{ascending:false});
 if(error){toast('Could not load projects: '+error.message);return;}
 projects=(data||[]).map(formatProject);pageNo=1;render();
}
async function recordActivity(projectId,action,details){
 if(!supabaseClient||!currentUser||!projectId)return;
 const {error}=await supabaseClient.from('project_activity').insert({project_id:projectId,user_id:currentUser.id,action,details});
 if(error)console.warn('Project activity was not recorded:',error.message);
}
window.addEventListener('landsetu:authenticated',async event=>{currentUser=event.detail?.user||null;profileData=event.detail?.profile||null;supabaseClient=window.landsetuSupabase||null;await loadProjects();});
window.addEventListener('landsetu:signedout',()=>{currentUser=null;profileData=null;projects=[];render();});
function statCards(items=projects){
 const total=items.length,onTrack=items.filter(p=>p.status==='On Track'||p.status==='Completed').length;
 const atRisk=items.filter(p=>p.status==='At Risk'||p.risk==='High'||p.risk==='Critical').length;
 const critical=items.filter(p=>p.risk==='Critical'||p.status==='On Hold').length;
 return '<div class="stats"><div class="stat"><div class="stat-icon">▰</div><div><strong>'+total+'</strong><span>Total Projects</span><div class="trend">From database</div></div></div><div class="stat"><div class="stat-icon green">✓</div><div><strong>'+onTrack+'</strong><span>On Track / Completed</span><div class="trend green">Live count</div></div></div><div class="stat"><div class="stat-icon orange">⚠</div><div><strong>'+atRisk+'</strong><span>At Risk</span><div class="trend orange">Live count</div></div></div><div class="stat"><div class="stat-icon red">!</div><div><strong>'+critical+'</strong><span>Critical / On Hold</span><div class="trend red">Live count</div></div></div></div>';
}
function indiaSvg(){return `<svg class="india-map" viewBox="0 0 330 390" role="img" aria-label="Stylised map of India"><path d="M83 15 118 7 143 21 174 14 190 37 222 43 218 68 242 81 225 105 245 125 224 148 237 169 216 191 211 220 193 243 183 273 165 304 147 339 130 374 112 346 102 317 86 289 76 258 56 237 49 209 31 187 43 161 25 138 38 115 28 91 47 72 45 48 66 43Z" fill="#eaf1fc" stroke="#c8d6ed" stroke-width="2"/><path d="m38 115 37-8 18 24-10 32-28 12-25-15Z" fill="#8db8f4"/><path d="m92 128 42-18 31 19-7 36-41 15-29-20Z" fill="#b8d1f6"/><path d="m169 130 43-13 26 24-15 31-39 2-23-20Z" fill="#7eacf0"/><path d="m78 184 43-8 31 24-14 38-35 4-28-25Z" fill="#286ed0"/><path d="m143 183 44-13 28 30-15 38-43 7-22-29Z" fill="#b7cff2"/><path d="m103 244 42-10 31 23-17 39-24 35-21-37Z" fill="#7eacf0"/><path d="m181 246 23-14 16 24-17 35-17-17Z" fill="#d2e1f8"/><path d="m214 84 23-8 18 19-15 21-20-7Z" fill="#d5e3f8"/><path d="m43 73 21-18 23 8-5 24-27 10Z" fill="#c1d7f6"/><path d="m248 149 18 12-4 28-12 13-8-27Z" fill="#dce8f9"/><path d="m161 337 12 15-8 22-13-12Z" fill="#dce8f9"/></svg>`}
function recentRows(){return projects.slice(0,3).map(p=>`<div class="project-mini"><div class="thumb">${p.symbol}</div><div><b>${p.name}</b><small>${p.state}</small></div><span class="status ${statusClass(p.status)}">${p.status}</span></div>`).join('')||'<p style="color:#657087;padding:20px 0">No projects yet. Add your first project to get started.</p>'}
function riskValue(level){return ({Low:20,Medium:45,High:70,Critical:90})[level]??0}
function riskCounts(items=projects){return ['Low','Medium','High','Critical'].map(level=>({level,count:items.filter(p=>p.risk===level).length}))}
function stateRiskSummary(items=projects){
 const groups={};items.forEach(p=>{const key=p.state||'Unspecified';(groups[key]??=[]).push(p)});
 return Object.entries(groups).map(([state,rows])=>({state,count:rows.length,score:Math.round(rows.reduce((n,p)=>n+riskValue(p.risk),0)/rows.length)})).sort((a,b)=>b.score-a.score);
}
function averageRisk(items=projects){return items.length?Math.round(items.reduce((n,p)=>n+riskValue(p.risk),0)/items.length):0}
function dashboard(){
 const states=stateRiskSummary().slice(0,5);
 return `<div class="hero"><div><h1>LandSetu</h1><p>Predict · Plan · Prevent</p></div><div class="hero-art">🏛️</div></div>${statCards()}<div class="dashboard-grid"><div class="panel"><h3><span class="mini">♧</span>Project Risk by State</h3>${states.length?'<div class="state-list">'+states.map(x=>`<div class="state-row"><span>${x.state} <small>(${x.count})</small></span><div class="bar"><i style="width:${x.score}%"></i></div><b>${x.score}%</b></div>`).join('')+'</div>':'<p style="color:#657087">Add projects to see state-level risk summaries.</p>'}</div><div class="panel"><h3>▥　Recent Projects <a href="#" onclick="go('projects');return false" style="float:right;color:#1557c0;font-size:15px;text-decoration:none">View All →</a></h3>${recentRows()}</div></div>`
}
function filtered(){return projects.filter(p=>(!filters.q||(p.name+' '+p.id).toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.state||p.state===filters.state)&&(!filters.district||p.district===filters.district)&&(!filters.status||p.status===filters.status)&&(!filters.risk||p.risk===filters.risk))}
function projectTable(){let all=filtered(),rows=all.slice((pageNo-1)*5,pageNo*5);return `<div class="page-head"><div><h1>Projects</h1><p>Manage and track all land acquisition projects</p></div><button class="primary" id="addProject">＋ Add Project</button></div>${statCards()}<div class="filters"><input id="projectSearch" placeholder="⌕  Search by project name or ID..." value="${filters.q}"><select id="stateFilter"><option value="">All States</option>${[...new Set(projects.map(p=>p.state))].map(s=>`<option ${filters.state===s?'selected':''}>${s}</option>`).join('')}</select><select id="districtFilter"><option value="">All Districts</option>${[...new Set(projects.map(p=>p.district))].map(s=>`<option ${filters.district===s?'selected':''}>${s}</option>`).join('')}</select><select id="statusFilter"><option value="">All Status</option>${['On Track','In Progress','At Risk','Completed','On Hold'].map(s=>`<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}</select><select id="riskFilter"><option value="">All Risk Level</option>${['Low','Medium','High','Critical'].map(s=>`<option ${filters.risk===s?'selected':''}>${s}</option>`).join('')}</select><button class="reset" id="reset">⟳ Reset</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>Project Name</th><th>State</th><th>District</th><th>Status</th><th>Risk Level</th><th>Progress</th><th>Expected Date</th><th>Actions</th></tr></thead><tbody>${rows.map((p,i)=>`<tr><td>${(pageNo-1)*5+i+1}</td><td><strong>${p.name}</strong><small>${p.id}</small></td><td>${p.state}</td><td>${p.district}</td><td><span class="status ${statusClass(p.status)}">${p.status}</span></td><td><span class="status ${p.risk==='High'||p.risk==='Critical'?'risk':p.risk==='Medium'?'medium':'track'}">${p.risk}</span></td><td>${p.progress}%<div class="progress"><i style="width:${p.progress}%"></i></div></td><td>▦　${p.date}</td><td><button class="view" onclick="viewProject('${p.id}')">Edit</button>　<button class="view" onclick="removeProject('${p.dbId}')" title="Delete">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;padding:35px">No projects match your filters.</td></tr>'}</tbody></table><div class="table-foot"><span>Showing ${all.length?((pageNo-1)*5+1):0}–${Math.min(pageNo*5,all.length)} of ${all.length} projects</span><div class="pages"><button onclick="changePage(-1)">‹</button><button class="active">${pageNo}</button><button onclick="changePage(1)">${pageNo+1}</button><button onclick="changePage(1)">›</button></div></div></div>`}
function insights(){
 const total=projects.length,high=projects.filter(p=>p.risk==='High'||p.risk==='Critical').length;
 const score=averageRisk(),states=stateRiskSummary(),distribution=riskCounts();
 const onTrack=projects.filter(p=>p.status==='On Track'||p.status==='Completed').length;
 const riskRows=distribution.map(x=>`<div class="bar-row"><span>${x.level}</span><div class="bar"><i style="width:${total?x.count/total*100:0}%"></i></div><b>${x.count} (${total?Math.round(x.count/total*100):0}%)</b></div>`).join('');
 const topState=states[0];
 return `<div class="page-head"><div><h1>Project Insights</h1><p>Live summaries calculated from your saved projects — not predictive AI forecasts</p></div></div>
 <div class="stats"><div class="stat"><div class="stat-icon">♧</div><div><strong>${score}%</strong><span>Average risk score</span><div class="trend">Derived from risk levels</div></div></div><div class="stat"><div class="stat-icon green">◷</div><div><strong>${onTrack}</strong><span>On Track / Completed</span><div class="trend green">Of ${total} projects</div></div></div><div class="stat"><div class="stat-icon orange">⚠</div><div><strong>${high}</strong><span>High / Critical Risk</span><div class="trend orange">Live count</div></div></div><div class="stat"><div class="stat-icon red">▣</div><div><strong>${total}</strong><span>Total Projects</span><div class="trend">From database</div></div></div></div>
 <div class="insights-grid"><div class="panel"><h3>Risk Distribution</h3><div class="bars">${riskRows||'<p>No project data yet.</p>'}</div></div><div class="panel"><h3>Key Insights</h3><div class="insight-row"><div class="insight-icon">⚠️</div><div><b>${high} projects have high or critical risk</b><small>Review these projects first and update their risk levels as conditions change.</small></div></div><div class="insight-row"><div class="insight-icon" style="background:#e9f8f0">✓</div><div><b>${onTrack} projects are on track or completed</b><small>${total?Math.round(onTrack/total*100):0}% of the current project list.</small></div></div><div class="insight-row"><div class="insight-icon" style="background:#edf4ff">ⓘ</div><div><b>${topState?topState.state+' has the highest average risk score':'No state-level data yet'}</b><small>${topState?topState.score+'% average score across '+topState.count+' project(s).':'Add projects with state and risk details to see comparisons.'}</small></div></div></div></div>
 <div class="lower-grid"><div class="panel"><h3>Risk Level Counts</h3><div class="bars">${riskRows||'<p>No project data yet.</p>'}</div></div><div class="panel"><h3>State Risk Overview</h3>${states.length?'<div class="state-list">'+states.map(x=>`<div class="state-row"><span>${x.state}</span><div class="bar"><i style="width:${x.score}%"></i></div><b>${x.score}%</b></div>`).join('')+'</div>':'<p>No state data available yet.</p>'}</div></div>`
}function mapPage(){
 const states=stateRiskSummary();
 return `<div class="page-head"><div><h1>LandSetu Map</h1><p>State-wise project risk summaries from your database</p></div></div>${statCards()}<div class="map-grid"><div class="panel map-panel"><h3>Project Coverage</h3><div class="india-wrap">${indiaSvg()}<div class="legend"><b>${projects.length} projects</b><span>Across ${states.length} states / regions</span><span>Average risk: ${averageRisk()}%</span><small>Illustrative India outline; state scores below are calculated from project records.</small></div></div></div><div><div class="panel"><h3>State Risk Overview</h3>${states.length?'<div class="state-list">'+states.map(x=>`<div class="state-row"><span>${x.state} <small>(${x.count})</small></span><div class="bar"><i style="width:${x.score}%"></i></div><b>${x.score}%</b></div>`).join('')+'</div>':'<p style="color:#657087">No project records yet. Add projects to populate this view.</p>'}</div><div class="panel" style="margin-top:16px"><h3>Risk Summary</h3><div class="keylist">${riskCounts().map(x=>`<div>${x.level}: <b>${x.count}</b> project(s)</div>`).join('')}</div></div></div></div>`
}
function reports(){
 const high=projects.filter(p=>p.risk==='High'||p.risk==='Critical').length;
 const states=new Set(projects.map(p=>p.state).filter(Boolean)).size;
 const avgProgress=projects.length?Math.round(projects.reduce((n,p)=>n+p.progress,0)/projects.length):0;
 return `<div class="page-head"><div><h1>Reports</h1><p>Generate reports from your saved project records</p></div><button class="primary" onclick="downloadReport()">↓ Export CSV</button></div><div class="report-grid"><div class="report-card"><span>📊 Project Overview</span><div class="big">${projects.length}</div><small>Projects tracked in your workspace</small><p><button class="view" onclick="downloadReport()">Download CSV</button></p></div><div class="report-card"><span>⚠️ High / Critical Risk</span><div class="big">${high}</div><small>Projects flagged High or Critical</small><p><button class="view" onclick="downloadReport()">Download CSV</button></p></div><div class="report-card"><span>📈 Average Progress</span><div class="big">${avgProgress}%</div><small>Mean progress across saved projects</small><p><button class="view" onclick="downloadReport()">Download CSV</button></p></div><div class="report-card"><span>📍 State-wise Summary</span><div class="big">${states}</div><small>States / regions represented in records</small><p><button class="view" onclick="downloadReport()">Download CSV</button></p></div></div>`
}
function safeText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function settings(){
 const p=profileData||{},email=currentUser?.email||'';
 return `<div class="page-head"><div><h1>Account Settings</h1><p>Manage your personal details and account security</p></div></div>
 <div class="settings-grid"><div class="panel"><h3>Personal Profile</h3><form id="profileSettingsForm" class="form-grid">
 <label>Full name<input name="full_name" required maxlength="100" value="${safeText(p.full_name||currentUser?.user_metadata?.full_name||'')}" placeholder="Your full name"></label>
 <label>Email address<input value="${safeText(email)}" disabled></label>
 <label>Phone number<input name="phone" maxlength="30" value="${safeText(p.phone||'')}" placeholder="Phone number"></label>
 <label>Department<input name="department" maxlength="100" value="${safeText(p.department||'')}" placeholder="Department"></label>
 <label>Designation<input name="designation" maxlength="100" value="${safeText(p.designation||'')}" placeholder="Designation"></label>
 <label>Account role<input value="${safeText(p.role||'viewer')}" disabled></label>
 <div style="grid-column:1/-1"><button class="primary" type="submit">Save Profile</button></div></form></div>
 <div class="panel"><h3>Account Information</h3><div class="settings-row"><span>Sign-in email</span><b>${safeText(email||'Not available')}</b></div><div class="settings-row"><span>Role</span><b>${safeText(p.role||'viewer')}</b></div><div class="settings-row"><span>Member since</span><b>${p.created_at?new Date(p.created_at).toLocaleDateString('en-IN'):'—'}</b></div><p style="color:#657087;font-size:13px;line-height:1.6">Your role and sign-in email are managed by the authentication and access-control system. Contact an administrator if either needs to change.</p></div></div>`
}
function bindSettings(){
 const form=$('#profileSettingsForm');if(!form)return;
 form.addEventListener('submit',async e=>{
  e.preventDefault();if(!currentUser||!supabaseClient)return toast('Please sign in again.');
  const d=Object.fromEntries(new FormData(form));
  const payload={full_name:d.full_name.trim(),phone:d.phone.trim()||null,department:d.department.trim()||null,designation:d.designation.trim()||null,updated_at:new Date().toISOString()};
  const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent='Saving…';
  try{
   const {data,error}=await supabaseClient.from('profiles').update(payload).eq('id',currentUser.id).select('*').single();
   if(error)throw error;
   profileData=data;
   const name=data.full_name||'User',box=document.querySelector('.profile');
   if(box){const avatar=box.querySelector('.avatar'),labels=box.querySelectorAll('div > b, div > small');if(avatar)avatar.textContent=name.slice(0,1).toUpperCase();if(labels[0])labels[0].textContent=name;}
   toast('Profile updated successfully');render();
  }catch(error){toast('Could not save profile: '+error.message);button.disabled=false;button.textContent='Save Profile';}
 });
}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#content').innerHTML=({dashboard,projects:projectTable,insights,map:mapPage,reports,settings}[page])();if(page==='projects')bindProjectFilters();if(page==='projects')$('#addProject').onclick=openModal;if(page==='settings')bindSettings();}
function go(p){page=p;render();window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function bindProjectFilters(){[['projectSearch','q'],['stateFilter','state'],['districtFilter','district'],['statusFilter','status'],['riskFilter','risk']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{filters[k]=e.target.value;pageNo=1;const pos=window.scrollY;render();window.scrollTo(0,pos)}));$('#reset').onclick=()=>{filters={q:'',state:'',district:'',status:'',risk:''};pageNo=1;render()}}
function changePage(n){pageNo=Math.max(1,Math.min(Math.ceil(filtered().length/5)||1,pageNo+n));render()}
function openModal(project=null){
 const form=$('#projectForm');form.reset();
 form.elements.recordId.value=project?.dbId||'';form.elements.name.value=project?.name||'';form.elements.id.value=project?.id||'';
 form.elements.state.value=project?.state||'';form.elements.district.value=project?.district||'';
 form.elements.status.value=project?.status||'In Progress';form.elements.risk.value=project?.risk||'Low';
 form.elements.progress.value=project?.progress??0;form.elements.date.value=project?.dateValue||'';
 $('#modal h2').textContent=project?'Edit Project':'Add New Project';
 $('#projectForm button[type="submit"]').textContent=project?'Save Changes':'Save Project';$('#modal').classList.add('show');
}
$('#cancel').onclick=()=>$('#modal').classList.remove('show');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
$('#projectForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!supabaseClient||!currentUser)return toast('Please sign in again before saving a project.');
 const form=e.currentTarget,d=Object.fromEntries(new FormData(form));
 if(d.id&&!/^[A-Za-z0-9_-]{1,40}$/.test(d.id))return toast('Project ID can contain only letters, numbers, hyphens and underscores.');
 const payload={project_code:d.id||null,name:d.name.trim(),state:d.state.trim(),district:d.district.trim(),status:d.status,risk_level:d.risk,progress:Number(d.progress)||0,expected_completion:d.date?d.date+'-01':null};
 const submit=form.querySelector('button[type="submit"]');submit.disabled=true;submit.textContent='Saving…';
 try{
  let result;if(d.recordId){result=await supabaseClient.from('projects').update(payload).eq('id',d.recordId).select('*').single();}
  else{result=await supabaseClient.from('projects').insert({...payload,created_by:currentUser.id}).select('*').single();}
  if(result.error)throw result.error;
  await recordActivity(result.data.id,d.recordId?'updated':'created',d.recordId?'Project details updated.':'Project created.');
  $('#modal').classList.remove('show');form.reset();filters={q:'',state:'',district:'',status:'',risk:''};pageNo=1;await loadProjects();toast(d.recordId?'Project updated successfully':'Project added successfully');
 }catch(error){toast('Could not save project: '+(error.message||'Unknown error'));}
 finally{submit.disabled=false;submit.textContent='Save Project';}
});
function viewProject(code){const p=projects.find(x=>x.id===code);if(p)openModal(p);}
async function removeProject(id){
 const p=projects.find(x=>x.dbId===id);if(!p||!confirm('Permanently delete "'+p.name+'" from LandSetu?'))return;
 const {error}=await supabaseClient.from('projects').delete().eq('id',id);if(error)return toast('Could not delete project: '+error.message);
 projects=projects.filter(x=>x.dbId!==id);render();toast('Project deleted');
}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2600)}
function downloadReport(){let csv='Project,ID,State,District,Status,Risk,Progress,Expected Date\\n'+projects.map(p=>[p.name,p.id,p.state,p.district,p.status,p.risk,p.progress+'%',p.date].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='landsetu-project-report.csv';a.click();URL.revokeObjectURL(a.href);toast('Report exported')}
$('#notify').onclick=()=>toast('You are all caught up — no new notifications.');
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){filters.q=e.target.value;go('projects')}});
render();
</script>
<script type="module" src="./auth.js"></script>
</body></html>
