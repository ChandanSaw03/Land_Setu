<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="emblem" role="img" aria-label="Earth globe">🌍</div><h2>LandSetu</h2><p>Predict · Plan · Prevent</p></div>
  <nav class="nav" id="nav">
    <button data-page="dashboard" class="active"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="projects"><span class="ico">▣</span>Projects</button>
    <button data-page="parcels"><span class="ico">▤</span>Land Parcels</button>
    <button data-page="legal"><span class="ico">⚖</span>Legal Cases</button>
    <button data-page="acquisition"><span class="ico">▣</span>Acquisition Workflow</button>
    <button data-page="insights"><span class="ico">✣</span>Project Insights</button>
    <button data-page="map"><span class="ico">◫</span>Map</button>
    <button data-page="reports"><span class="ico">▤</span>Reports</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
    <button data-page="users" id="usersNav" hidden><span class="ico">♙</span>User Management</button>
  </nav>
  <div class="sidebar-bottom"><div class="monument">♜</div><b>Smarter Land<br>Stronger India</b><div class="tricolor"></div></div>
</aside>
<main>
<header class="topbar">
  <div class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Search projects..."></div>
  <div class="top-actions"><select class="pill-select" id="region"><option>All India</option><option>North India</option><option>West India</option><option>South India</option><option>East India</option></select><button class="icon-btn" id="notify" title="Notifications">♧<i class="dot" id="notifyBadge" style="display:none"></i></button><div class="profile"><div class="avatar">U</div><div><b>Account</b><small>Signed in</small></div></div></div>
</header>
<div class="notification-panel" id="notificationPanel" aria-live="polite"></div>
<section id="content"></section>
</main>
</div>
<div class="modal-back" id="modal"><div class="modal"><h2>Add New Project</h2><form id="projectForm"><input type="hidden" name="recordId"><div class="form-grid">
<label>Project name<input name="name" required placeholder="Enter project name"></label>
<label>Project ID<input name="id" placeholder="PRJ-001239"></label>
<label>State<input name="state" required placeholder="State"></label>
<label>District<input name="district" required placeholder="District"></label>
<label>Status<select name="status"><option>In Progress</option><option>On Track</option><option>At Risk</option><option>Completed</option><option>On Hold</option></select></label>
<label>Risk level<select name="risk"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label>
<label>Progress (%)<input name="progress" type="number" min="0" max="100" value="0"></label>
<label>Expected date<input name="date" type="month"></label>
<label>Latitude<input name="latitude" type="number" min="-90" max="90" step="any" placeholder="e.g. 28.6139"></label>
<label>Longitude<input name="longitude" type="number" min="-180" max="180" step="any" placeholder="e.g. 77.2090"></label>
<div style="grid-column:1/-1"><small style="color:#657087">Choose the exact project point by clicking the map below, or enter coordinates manually. Coordinates are optional.</small><div id="projectLocationPicker" class="location-picker" aria-label="Click map to choose project coordinates"></div></div>
<label id="managerAssignField" hidden>Assign Project Manager<select name="manager_id" id="managerSelect"><option value="">Unassigned</option></select></label>
</div><div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" class="primary">Save Project</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
let projects=[];
let landParcels=[];
let compensationPayments=[];
let parcelDocuments=[];
let legalCases=[];
let legalHearings=[];
let parcelAcquisitions=[];
let acquisitionAwards=[];
let acquisitionMilestones=[];
let currentUser=null,supabaseClient=null,profileData=null,projectAssignments=new Set(),managerProfiles=[],profileDirectory=[];
let page='dashboard',pageNo=1,filters={q:'',state:'',district:'',status:'',risk:''},locationPickerMap=null;
const $=s=>document.querySelector(s);
function currentRole(){return profileData?.role||'viewer'}
function roleLabel(role=currentRole()){return ({national_admin:'National Admin',state_admin:'State Admin',project_manager:'Project Manager',analyst:'Analyst',viewer:'Viewer'})[role]||'Viewer'}
function canCreateProjects(){return ['national_admin','state_admin','project_manager'].includes(currentRole())}
function canEditProject(p){return currentRole()==='national_admin'||(currentRole()==='state_admin'&&p.state===profileData?.assigned_state)||(currentRole()==='project_manager'&&projectAssignments.has(p.dbId))}
function canDeleteProject(p){return currentRole()==='national_admin'||(currentRole()==='state_admin'&&p.state===profileData?.assigned_state)}
function pageAllowed(p){if(p==='users')return currentRole()==='national_admin';if(p==='insights')return currentRole()!=='viewer';return ['dashboard','projects','parcels','legal','acquisition','map','reports','settings'].includes(p)}
function statusClass(s){return s==='At Risk'||s==='Critical'?'risk':s==='On Track'||s==='Completed'?'track':s==='On Hold'?'medium':''}
function formatProject(row){
 const date=row.expected_completion?new Date(row.expected_completion+'T00:00:00'):null;
 return {dbId:row.id,id:row.project_code||row.id,name:row.name,state:row.state,district:row.district,status:row.status,risk:row.risk_level,progress:Number(row.progress)||0,latitude:row.latitude==null?null:Number(row.latitude),longitude:row.longitude==null?null:Number(row.longitude),date:date?date.toLocaleDateString('en-IN',{month:'short',year:'numeric'}):'—',dateValue:row.expected_completion?row.expected_completion.slice(0,7):''};
}
async function loadProjects(){
 if(!supabaseClient||!currentUser)return;
 const {data,error}=await supabaseClient.from('projects').select('*').order('created_at',{ascending:false});
 if(error){toast('Could not load projects: '+error.message);return;}
 projects=(data||[]).map(formatProject);
 projectAssignments=new Set();
 if(projects.length){const {data:assignments}=await supabaseClient.from('project_assignments').select('project_id,user_id');projectAssignments=new Set((assignments||[]).filter(x=>x.user_id===currentUser.id).map(x=>x.project_id));}
 managerProfiles=[];
 if(['national_admin','state_admin'].includes(currentRole())){let q=supabaseClient.from('profiles').select('id,full_name,email,assigned_state').eq('role','project_manager').order('full_name');if(currentRole()==='state_admin')q=q.eq('assigned_state',profileData?.assigned_state||'');const {data:managers}=await q;managerProfiles=managers||[];}
 if(currentRole()==='national_admin'){const {data:people}=await supabaseClient.from('profiles').select('id,full_name,email,role,assigned_state').order('full_name');profileDirectory=people||[];}
 pageNo=1;render();
}
async function recordActivity(projectId,action,details){
 if(!supabaseClient||!currentUser||!projectId)return;
 const {error}=await supabaseClient.from('project_activity').insert({project_id:projectId,user_id:currentUser.id,action,details});
 if(error)console.warn('Project activity was not recorded:',error.message);
}
window.addEventListener('landsetu:authenticated',async event=>{currentUser=event.detail?.user||null;profileData=event.detail?.profile||null;supabaseClient=window.landsetuSupabase||null;await loadProjects();});
window.addEventListener('landsetu:signedout',()=>{currentUser=null;profileData=null;projects=[];projectAssignments=new Set();managerProfiles=[];profileDirectory=[];render();});
function statCards(items=projects){
 const total=items.length,onTrack=items.filter(p=>p.status==='On Track'||p.status==='Completed').length;
 const atRisk=items.filter(p=>p.status==='At Risk'||p.risk==='High'||p.risk==='Critical').length;
 const critical=items.filter(p=>p.risk==='Critical'||p.status==='On Hold').length;

function initProjectMap(){

 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
 const points=[],stateMarkerCounts={};
 let exactCount=0,approxCount=0;
 projects.forEach(p=>{
  const hasExact=Number.isFinite(p.latitude)&&Number.isFinite(p.longitude);
  let position=hasExact?[p.latitude,p.longitude]:INDIA_STATE_APPROX_CENTRES[String(p.state||'').trim().toLowerCase()];
  if(!position)return;
  if(hasExact)exactCount++;else{
   approxCount++;
   const key=String(p.state||'').trim().toLowerCase(),n=stateMarkerCounts[key]||0;
   stateMarkerCounts[key]=n+1;
   if(n)position=[position[0]+(n%3)*0.018,position[1]+Math.ceil(n/3)*0.018];
  }
  const color=(p.risk==='Critical'||p.risk==='High')?'#dc4b55':p.risk==='Medium'?'#e69a35':'#23966a';
  const marker=L.marker(position,{title:p.name,alt:p.name,riseOnHover:true}).addTo(map);
  const locationLabel=hasExact?'Exact project coordinates':'Approximate state-centre position';
  marker.bindPopup('<b>'+safeText(p.name)+'</b><br>'+safeText(p.district)+', '+safeText(p.state)+'<br>Risk: '+safeText(p.risk)+' · '+safeText(p.status)+'<br>Progress: '+p.progress+'%<br><strong>'+locationLabel+'</strong>'+(hasExact?'<br><small>'+p.latitude.toFixed(5)+', '+p.longitude.toFixed(5)+'</small>':'<br><small>Edit this project and choose its exact location on the picker map.</small>'));
  points.push(position);
 });

}

function bindParcelDocumentForm(){
 const form=$('#parcelDocumentForm');if(!form)return;
 form.onsubmit=async e=>{
  e.preventDefault();if(!supabaseClient||!currentUser)return toast('Please sign in again.');
  const d=Object.fromEntries(new FormData(form)),file=form.elements.document_file.files[0],parcel=landParcels.find(p=>p.id===d.parcel_id);
  if(!parcel||!file)return toast('Select a parcel and a document file.');
  if(file.size<=0||file.size>15*1024*1024)return toast('Choose a file smaller than 15 MB.');
  const allowed=['application/pdf','image/jpeg','image/png','image/webp','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-excel','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];
  if(!allowed.includes(file.type))return toast('This file type is not supported.');
  const button=$('#documentUpload');button.disabled=true;button.textContent='Uploading…';
  const id=crypto.randomUUID(),cleanName=file.name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-120)||'document',path=parcel.project_id+'/'+parcel.id+'/'+id+'-'+cleanName;
  try{
   const {error:uploadError}=await supabaseClient.storage.from('land-documents').upload(path,file,{cacheControl:'3600',contentType:file.type,upsert:false});
   if(uploadError)throw uploadError;
   const {error:recordError}=await supabaseClient.from('parcel_documents').insert({id,parcel_id:parcel.id,project_id:parcel.project_id,document_type:d.document_type,title:d.title.trim(),file_name:file.name,storage_path:path,mime_type:file.type,file_size:file.size,uploaded_by:currentUser.id});
   if(recordError){await supabaseClient.storage.from('land-documents').remove([path]);throw recordError;}
   toast('Land document uploaded successfully.');await loadLandParcels();render();
  }catch(error){toast('Could not upload document: '+error.message);button.disabled=false;button.textContent='Upload Document';}
 };
}
async function openParcelDocument(id){

 const {data,error}=await supabaseClient.storage.from('land-documents').createSignedUrl(doc.storage_path,60);

 target.location.href=data.signedUrl;
}
async function deleteParcelDocument(id){
 const doc=parcelDocuments.find(x=>x.id===id);if(!doc)return toast('Document record not found.');
 if(!window.confirm('Delete '+doc.title+' and its stored file? This cannot be undone.'))return;
 const {error:removeError}=await supabaseClient.storage.from('land-documents').remove([doc.storage_path]);
 if(removeError)return toast('Could not delete stored file: '+removeError.message);
 const {error:recordError}=await supabaseClient.from('parcel_documents').delete().eq('id',id);
 if(recordError)return toast('File deleted, but document record could not be removed: '+recordError.message);
 toast('Document deleted.');await loadLandParcels();render();
}
async function reviewParcelDocument(id,status){
 if(!['Verified','Rejected'].includes(status))return;
 const doc=parcelDocuments.find(x=>x.id===id);if(!doc)return toast('Document record not found.');
 const reviewNotes=status==='Rejected'?window.prompt('Reason for rejecting this document:',''):'';
 if(status==='Rejected'&&reviewNotes===null)return;
 const payload={verification_status:status,review_notes:(reviewNotes||'').trim()||null,verified_by:status==='Verified'?currentUser.id:null,verified_at:status==='Verified'?new Date().toISOString():null,updated_at:new Date().toISOString()};
 const {error}=await supabaseClient.from('parcel_documents').update(payload).eq('id',id);
 if(error)return toast('Could not update document review: '+error.message);
 toast('Document marked '+status.toLowerCase()+'.');await loadLandParcels();render();
}

function render(){if(!pageAllowed(page))page='dashboard';document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.hidden=!pageAllowed(b.dataset.page)});$('#content').innerHTML=({dashboard,projects:projectTable,parcels:parcelsPage,legal:legalPage,acquisition:acquisitionPage,insights,map:mapPage,reports,settings,users:usersPage}[page])();if(page==='projects')bindProjectFilters();if(page==='map')initProjectMap();if(page==='projects'&&$('#addProject'))$('#addProject').onclick=()=>openModal();if(page==='parcels'){bindParcelForm();bindPaymentForm();bindParcelDocumentForm();}if(page==='legal')bindLegalForms();if(page==='acquisition')bindAcquisitionForms();if(page==='settings')bindSettings();if(page==='users')bindUsers();}
async function go(p){if(!pageAllowed(p))return toast('Your account does not have permission to open this section.');page=p;if(p==='parcels'||p==='legal')await loadLandParcels();if(p==='legal')await loadLegalCases();if(p==='acquisition'){await loadLandParcels();await loadAcquisitionWorkflow();}render();window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function bindProjectFilters(){[['projectSearch','q'],['stateFilter','state'],['districtFilter','district'],['statusFilter','status'],['riskFilter','risk']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{filters[k]=e.target.value;pageNo=1;const pos=window.scrollY;render();window.scrollTo(0,pos)}));$('#reset').onclick=()=>{filters={q:'',state:'',district:'',status:'',risk:''};pageNo=1;render()}}
function changePage(n){pageNo=Math.max(1,Math.min(Math.ceil(filtered().length/5)||1,pageNo+n));render()}
function openModal(project=null){
 if(!canCreateProjects()||(project&&!canEditProject(project)))return toast('You do not have permission to edit this project.');
 const form=$('#projectForm');form.reset();
 form.elements.recordId.value=project?.dbId||'';form.elements.name.value=project?.name||'';form.elements.id.value=project?.id||'';
 form.elements.state.value=project?.state||'';form.elements.district.value=project?.district||'';
 form.elements.status.value=project?.status||'In Progress';form.elements.risk.value=project?.risk||'Low';
 form.elements.progress.value=project?.progress??0;form.elements.date.value=project?.dateValue||'';form.elements.latitude.value=project?.latitude??'';form.elements.longitude.value=project?.longitude??'';
 const managerField=$('#managerAssignField'),managerSelect=$('#managerSelect');managerField.hidden=!['national_admin','state_admin'].includes(currentRole());managerSelect.innerHTML='<option value="">Unassigned</option>'+managerProfiles.map(m=>'<option value="'+safeText(m.id)+'">'+safeText(m.full_name||m.email||'Project Manager')+'</option>').join('');
 $('#modal h2').textContent=project?'Edit Project':'Add New Project';
 $('#projectForm button[type="submit"]').textContent=project?'Save Changes':'Save Project';$('#modal').classList.add('show');setTimeout(()=>initProjectLocationPicker(project),120);
}
$('#cancel').onclick=()=>$('#modal').classList.remove('show');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
$('#projectForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!supabaseClient||!currentUser)return toast('Please sign in again before saving a project.');if(!canCreateProjects())return toast('Your role cannot create projects.');
 const form=e.currentTarget,d=Object.fromEntries(new FormData(form));
 if(d.id&&!/^[A-Za-z0-9_-]{1,40}$/.test(d.id))return toast('Project ID can contain only letters, numbers, hyphens and underscores.');
 const latitude=d.latitude.trim()===''?null:Number(d.latitude),longitude=d.longitude.trim()===''?null:Number(d.longitude);
 if((latitude===null)!==(longitude===null))return toast('Enter both latitude and longitude, or leave both blank.');
 if(latitude!==null&&(!Number.isFinite(latitude)||latitude < -90||latitude > 90))return toast('Latitude must be between -90 and 90.');
 if(longitude!==null&&(!Number.isFinite(longitude)||longitude < -180||longitude > 180))return toast('Longitude must be between -180 and 180.');
 const payload={project_code:d.id||null,name:d.name.trim(),state:d.state.trim(),district:d.district.trim(),status:d.status,risk_level:d.risk,progress:Number(d.progress)||0,expected_completion:d.date?d.date+'-01':null,latitude,longitude};
 const submit=form.querySelector('button[type="submit"]');submit.disabled=true;submit.textContent='Saving…';
 try{
  let result;if(d.recordId){result=await supabaseClient.from('projects').update(payload).eq('id',d.recordId).select('*').single();}
  else{result=await supabaseClient.from('projects').insert({...payload,created_by:currentUser.id}).select('*').single();}
  if(result.error)throw result.error;
  if(!d.recordId&&currentRole()==='project_manager'){const assigned=await supabaseClient.from('project_assignments').insert({project_id:result.data.id,user_id:currentUser.id,assigned_by:currentUser.id});if(assigned.error)throw assigned.error;}
  if(['national_admin','state_admin'].includes(currentRole())&&d.manager_id){const removed=await supabaseClient.from('project_assignments').delete().eq('project_id',result.data.id);if(removed.error)throw removed.error;const assigned=await supabaseClient.from('project_assignments').insert({project_id:result.data.id,user_id:d.manager_id,assigned_by:currentUser.id});if(assigned.error)throw assigned.error;}
  await recordActivity(result.data.id,d.recordId?'updated':'created',d.recordId?'Project details updated.':'Project created.');
  $('#modal').classList.remove('show');form.reset();filters={q:'',state:'',district:'',status:'',risk:''};pageNo=1;await loadProjects();toast(d.recordId?'Project updated successfully':'Project added successfully');
 }catch(error){toast('Could not save project: '+(error.message||'Unknown error'));}
 finally{submit.disabled=false;submit.textContent='Save Project';}
});
function viewProject(code){const p=projects.find(x=>x.id===code);if(p)openModal(p);}
async function removeProject(id){
 const p=projects.find(x=>x.dbId===id);if(!p||!canDeleteProject(p))return toast('You do not have permission to delete this project.');if(!confirm('Permanently delete "'+p.name+'" from LandSetu?'))return;
 const {error}=await supabaseClient.from('projects').delete().eq('id',id);if(error)return toast('Could not delete project: '+error.message);
 projects=projects.filter(x=>x.dbId!==id);render();toast('Project deleted');
}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2600)}
function downloadReport(){let csv='Project,ID,State,District,Status,Risk,Progress,Expected Date\\n'+projects.map(p=>[p.name,p.id,p.state,p.district,p.status,p.risk,p.progress+'%',p.date].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='landsetu-project-report.csv';a.click();URL.revokeObjectURL(a.href);toast('Report exported')}
function relativeDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?'':date.toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});}
async function loadNotificationCenter(){
 const panel=$('#notificationPanel');
 if(!supabaseClient||!currentUser){panel.innerHTML='<div class="notification-empty">Sign in to view notifications.</div>';return;}
 panel.innerHTML='<div class="notification-empty">Loading notifications…</div>';
 try{
  const [n,a]=await Promise.all([
   supabaseClient.from('notifications').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(30),
   supabaseClient.from('project_activity').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(12)
  ]);
  if(n.error)throw n.error;
  if(a.error)throw a.error;
  const notifications=n.data||[],activities=a.data||[];
  const unread=notifications.filter(x=>!x.is_read).length;
  const badge=$('#notifyBadge');if(badge){badge.textContent=unread>9?'9+':String(unread);badge.style.display=unread?'block':'none';}
  const names=new Map(projects.map(p=>[p.dbId,p.name]));
  panel.innerHTML='<div class="notification-head"><h3>Notifications</h3><button id="markAllRead" '+(unread?'':'disabled')+'>Mark all as read</button></div>'+
   (notifications.length?notifications.map(x=>'<div class="notification-item '+(!x.is_read?'unread':'')+'"><b>'+safeText(x.title)+'</b><p>'+safeText(x.message)+'</p><small>'+safeText(x.category)+' · '+safeText(relativeDate(x.created_at))+'</small> '+(!x.is_read?'<button data-mark-read="'+safeText(x.id)+'">Mark read</button>':'')+'</div>').join(''):'<div class="notification-empty">You have no notifications yet.</div>')+
   '<h4 class="activity-heading">Recent project activity</h4>'+
   (activities.length?activities.map(x=>'<div class="activity-item"><b>'+safeText(names.get(x.project_id)||'Project activity')+' · '+safeText(x.action)+'</b><span>'+safeText(x.details||'No additional details')+'</span><br><small>'+safeText(relativeDate(x.created_at))+'</small></div>').join(''):'<div class="notification-empty">No project activity recorded yet.</div>');
  $('#markAllRead')?.addEventListener('click',async()=>{
   const {error}=await supabaseClient.from('notifications').update({is_read:true}).eq('user_id',currentUser.id).eq('is_read',false);
   if(error)return toast('Could not update notifications: '+error.message);
   await loadNotificationCenter();toast('All notifications marked as read');
  });
  panel.querySelectorAll('[data-mark-read]').forEach(button=>button.addEventListener('click',async()=>{
   const {error}=await supabaseClient.from('notifications').update({is_read:true}).eq('id',button.dataset.markRead).eq('user_id',currentUser.id);
   if(error)return toast('Could not mark notification as read: '+error.message);
   await loadNotificationCenter();
  }));
 }catch(error){panel.innerHTML='<div class="notification-empty">Could not load notifications: '+safeText(error.message)+'</div>';}
}
$('#notify').onclick=async()=>{
 const panel=$('#notificationPanel'),opening=!panel.classList.contains('open');
 panel.classList.toggle('open',opening);
 if(opening)await loadNotificationCenter();
};
document.addEventListener('click',event=>{
 const panel=$('#notificationPanel');
 if(panel?.classList.contains('open')&&!panel.contains(event.target)&&!$('#notify').contains(event.target))panel.classList.remove('open');
});

$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){filters.q=e.target.value;go('projects')}});
render();
</script>
