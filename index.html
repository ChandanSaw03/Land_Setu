<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="emblem">♛</div><h2>LandSetu</h2><p>Predict · Plan · Prevent</p></div>
  <nav class="nav" id="nav">
    <button data-page="dashboard" class="active"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="projects"><span class="ico">▣</span>Projects</button>
    <button data-page="bhoomi"><span class="ico">✣</span>BhoomiPredict</button>
    <button data-page="insights"><span class="ico">✣</span>Project Insights</button>
    <button data-page="map"><span class="ico">◫</span>Map</button>
    <button data-page="reports"><span class="ico">▤</span>Reports</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
  </nav>
  <div class="sidebar-bottom"><div class="monument">♜</div><b>Smarter Land<br>Stronger India</b><div class="tricolor"></div></div>
</aside>
<main>
<header class="topbar">
  <div class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Search projects..."></div>
  <div class="top-actions"><select class="pill-select" id="region"><option>All India</option><option>North India</option><option>West India</option><option>South India</option><option>East India</option></select><button class="icon-btn" id="notify" title="Notifications">♧<i class="dot" id="notifyBadge" style="display:none"></i></button><div class="profile"><div class="avatar">U</div><div><b>Account</b><small>Signed in</small></div></div></div>
</header>
<div class="notification-panel" id="notificationPanel" aria-live="polite"></div>
<section id="content"></section>
</main>
</div>
<div class="modal-back" id="modal"><div class="modal"><h2>Add New Project</h2><form id="projectForm"><input type="hidden" name="recordId"><div class="form-grid">
<label>Project name<input name="name" required placeholder="Enter project name"></label>
<label>Project ID<input name="id" placeholder="PRJ-001239"></label>
<label>State<input name="state" required placeholder="State"></label>
<label>District<input name="district" required placeholder="District"></label>
<label>Status<select name="status"><option>In Progress</option><option>On Track</option><option>At Risk</option><option>Completed</option><option>On Hold</option></select></label>
<label>Risk level<select name="risk"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label>
<label>Progress (%)<input name="progress" type="number" min="0" max="100" value="0"></label>
<label>Expected date<input name="date" type="month"></label>
<label>Latitude<input name="latitude" type="number" min="-90" max="90" step="any" placeholder="e.g. 28.6139"></label>
<label>Longitude<input name="longitude" type="number" min="-180" max="180" step="any" placeholder="e.g. 77.2090"></label>
<label>Acquisition stage<select name="acquisition_stage"><option>Planning</option><option>Notification</option><option>Valuation</option><option>Compensation</option><option>Possession</option><option>Rehabilitation</option><option>Completed</option></select></label>
<label>Compensation completion (%)<input name="compensation_completion" type="number" min="0" max="100" placeholder="Unknown"></label>
<label>Approval delay (days)<input name="approval_delay_days" type="number" min="0" placeholder="Unknown"></label>
<label>Disputes / objections<input name="dispute_count" type="number" min="0" placeholder="Unknown"></label>
<label>Possession progress (%)<input name="possession_progress" type="number" min="0" max="100" placeholder="Unknown"></label>
<label>Rehabilitation progress (%)<input name="rehabilitation_progress" type="number" min="0" max="100" placeholder="Unknown"></label>
<label>Historical department delay (days)<input name="historical_department_delay_days" type="number" min="0" placeholder="Unknown"></label>
<label>Source / department MIS<input name="source_name" maxlength="160" placeholder="Authorized source name"></label>
<label>Source record ID<input name="source_record_id" maxlength="120" placeholder="Source record identifier"></label>
<label>Source last updated<input name="source_updated_at" type="date"></label>
<label><span>Source record verified</span><input name="source_verified" type="checkbox"></label>
</div><div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" class="primary">Save Project</button></div></form></div></div>
<div class="modal-back" id="feedbackModal"><div class="modal"><h2>Record Officer Feedback</h2><form id="feedbackForm"><input type="hidden" name="project_id"><div class="form-grid">
<label>Actual status<select name="actual_status" required><option>In Progress</option><option>On Track</option><option>At Risk</option><option>Completed</option><option>On Hold</option></select></label>
<label>Actual progress (%)<input name="actual_progress" type="number" min="0" max="100" required></label>
<label>Actual delay (days)<input name="actual_delay_days" type="number" min="0" value="0" required></label>
<label style="grid-column:1/-1">Update notes<textarea name="notes" maxlength="2000" placeholder="Record verified progress and outcome notes"></textarea></label>
<label><span>Verified record</span><input name="verified" type="checkbox"></label>
</div><div class="modal-actions"><button type="button" class="secondary" id="feedbackCancel">Cancel</button><button type="submit" class="primary">Save Feedback</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let projects=[];
let currentUser=null,supabaseClient=null,profileData=null;
let page='dashboard',pageNo=1,filters={q:'',state:'',district:'',status:'',risk:''};
const $=s=>document.querySelector(s);
function statusClass(s){return s==='At Risk'||s==='Critical'?'risk':s==='On Track'||s==='Completed'?'track':s==='On Hold'?'medium':''}
function formatProject(row){
 const date=row.expected_completion?new Date(row.expected_completion+'T00:00:00'):null;
 const optionalNumber=value=>value===null||value===undefined||value===''?null:Number(value);
 return {dbId:row.id,id:row.project_code||row.id,name:row.name,state:row.state,district:row.district,status:row.status,risk:row.risk_level,progress:Number(row.progress)||0,date:date?date.toLocaleDateString('en-IN',{month:'short',year:'numeric'}):'—',dateValue:row.expected_completion?row.expected_completion.slice(0,7):'',latitude:optionalNumber(row.latitude),longitude:optionalNumber(row.longitude),stage:row.acquisition_stage||'Planning',compensation:optionalNumber(row.compensation_completion),approvalDelay:optionalNumber(row.approval_delay_days),disputes:optionalNumber(row.dispute_count),possession:optionalNumber(row.possession_progress),rehabilitation:optionalNumber(row.rehabilitation_progress),departmentDelay:optionalNumber(row.historical_department_delay_days),sourceName:row.source_name||'',sourceRecordId:row.source_record_id||'',sourceVerified:Boolean(row.source_verified),sourceUpdated:row.source_updated_at||'',symbol:'🏗️'};
}
async function loadProjects(){
 if(!supabaseClient||!currentUser)return;
 const {data,error}=await supabaseClient.from('projects').select('*').order('created_at',{ascending:false});
 if(error){toast('Could not load projects: '+error.message);return;}
 projects=(data||[]).map(formatProject);pageNo=1;render();
}
async function recordActivity(projectId,action,details){
 if(!supabaseClient||!currentUser||!projectId)return;
 const {error}=await supabaseClient.from('project_activity').insert({project_id:projectId,user_id:currentUser.id,action,details});
 if(error)console.warn('Project activity was not recorded:',error.message);
}
window.addEventListener('landsetu:authenticated',async event=>{currentUser=event.detail?.user||null;profileData=event.detail?.profile||null;supabaseClient=window.landsetuSupabase||null;await loadProjects();});
window.addEventListener('landsetu:signedout',()=>{currentUser=null;profileData=null;projects=[];render();});
function statCards(items=projects){
 const total=items.length,onTrack=items.filter(p=>p.status==='On Track'||p.status==='Completed').length;
 const atRisk=items.filter(p=>p.status==='At Risk'||p.risk==='High'||p.risk==='Critical').length;
 const critical=items.filter(p=>p.risk==='Critical'||p.status==='On Hold').length;
 return '<div class="stats"><div class="stat"><div class="stat-icon">▰</div><div><strong>'+total+'</strong><span>Total Projects</span><div class="trend">From database</div></div></div><div class="stat"><div class="stat-icon green">✓</div><div><strong>'+onTrack+'</strong><span>On Track / Completed</span><div class="trend green">Live count</div></div></div><div class="stat"><div class="stat-icon orange">⚠</div><div><strong>'+atRisk+'</strong><span>At Risk</span><div class="trend orange">Live count</div></div></div><div class="stat"><div class="stat-icon red">!</div><div><strong>'+critical+'</strong><span>Critical / On Hold</span><div class="trend red">Live count</div></div></div></div>';
}

function predictProject(p){
 const factors=[];let observations=0;
 const add=(name,points,detail)=>{if(points>0)factors.push({name,points,detail})};
 if(p.approvalDelay!==null){observations++;add('Approval delay',Math.min(25,Math.round(p.approvalDelay/4)),p.approvalDelay+' day(s) recorded');}
 if(p.disputes!==null){observations++;add('Disputes / objections',Math.min(20,p.disputes*5),p.disputes+' open dispute(s) recorded');}
 if(p.compensation!==null){observations++;add('Compensation backlog',Math.round((100-p.compensation)*0.15),p.compensation+'% compensation completion');}
 if(p.possession!==null){observations++;add('Possession backlog',Math.round((100-p.possession)*0.12),p.possession+'% possession progress');}
 if(p.rehabilitation!==null){observations++;add('Rehabilitation backlog',Math.round((100-p.rehabilitation)*0.10),p.rehabilitation+'% rehabilitation progress');}
 if(p.departmentDelay!==null){observations++;add('Historical department delays',Math.min(15,Math.round(p.departmentDelay/10)),p.departmentDelay+' historical delay day(s) entered');}
 if(p.dateValue){
  observations++;
  if(p.status!=='Completed'&&p.dateValue<new Date().toISOString().slice(0,7))add('Past expected completion',20,'Expected completion month has passed');
 }
 const score=Math.min(100,factors.reduce((sum,factor)=>sum+factor.points,0));
 const level=!observations?'Insufficient data':score>=70?'Critical':score>=50?'High':score>=25?'Medium':'Low';
 return {score,level,probability:observations?score:null,delayDays:observations?Math.round(score*0.8):null,factors:factors.sort((a,b)=>b.points-a.points)};
}
function actionsFor(p,prediction){
 const actions=[];
 if(prediction.level==='Insufficient data')actions.push({owner:'Project officer',action:'Verify the source record and enter available acquisition-stage progress indicators.'});
 if(p.approvalDelay>0)actions.push({owner:'Approving department',action:'Review the pending approval and log a dated resolution plan.'});
 if(p.disputes>0)actions.push({owner:'District land officer',action:'Triage open objections and schedule a documented resolution meeting.'});
 if(p.compensation!==null&&p.compensation<100)actions.push({owner:'Compensation / finance cell',action:'Reconcile award and payment records; prioritize eligible pending cases.'});
 if(p.possession!==null&&p.possession<100)actions.push({owner:'District administration',action:'Validate parcel-wise possession status and record outstanding constraints.'});
 if(p.rehabilitation!==null&&p.rehabilitation<100)actions.push({owner:'Rehabilitation team',action:'Review eligible affected-family cases and agree next milestones.'});
 if(!actions.length&&prediction.score<25)actions.push({owner:'Project officer',action:'Continue routine monitoring and update source records at the next review.'});
 const target=new Date();target.setDate(target.getDate()+7);
 const targetDate=[target.getFullYear(),String(target.getMonth()+1).padStart(2,'0'),String(target.getDate()).padStart(2,'0')].join('-');
 return actions.slice(0,3).map(item=>({...item,targetDate}));
}

async function loadLcwEvaluation(){

 }catch(error){

 }

function parseCsv(text){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){
  const char=text[i];
  if(quoted){
   if(char==='"'&&text[i+1]==='"'){cell+='"';i++;}
   else if(char==='"')quoted=false;
   else cell+=char;
  }else if(char==='"'&&cell==='')quoted=true;
  else if(char===','){row.push(cell.trim());cell='';}
  else if(char==='\n'||char==='\r'){
   if(char==='\r'&&text[i+1]==='\n')i++;
   row.push(cell.trim());cell='';
   if(row.some(value=>value!==''))rows.push(row);
   row=[];
  }else cell+=char;
 }
 if(quoted)throw new Error('CSV contains an unclosed quoted field.');
 row.push(cell.trim());if(row.some(value=>value!==''))rows.push(row);
 if(rows.length<2)throw new Error('CSV must contain a header and at least one project row.');
 const headers=rows.shift().map(value=>value.replace(/^\uFEFF/,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''));
 if(headers.some(header=>!header)||new Set(headers).size!==headers.length)throw new Error('CSV headers must be non-empty and unique after standardization.');
 return rows.map((values,index)=>{
  if(values.length!==headers.length)throw new Error(`CSV line ${index+2} has ${values.length} columns; expected ${headers.length}.`);
  return {line:index+2,record:Object.fromEntries(headers.map((header,i)=>[header,values[i]||'']))};
 });
}
function normalizePlace(value){
 return value.trim().replace(/\s+/g,' ').toLocaleLowerCase('en-IN').replace(/(^|[\s'-])\p{L}/gu,letter=>letter.toLocaleUpperCase('en-IN'));
}
function normalizeStatus(value){
 const key=value.trim().toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');
 const values={'on track':'On Track','track':'On Track','in progress':'In Progress','ongoing':'In Progress','at risk':'At Risk','risk':'At Risk','completed':'Completed','complete':'Completed','on hold':'On Hold','hold':'On Hold'};
 if(!values[key])throw new Error(`Unknown status "${value}".`);
 return values[key];
}
function normalizeStage(value){
 const key=value.trim().toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');
 const values={planning:'Planning',notification:'Notification',valuation:'Valuation',compensation:'Compensation',possession:'Possession',rehabilitation:'Rehabilitation',completed:'Completed'};
 if(!values[key])throw new Error(`Unknown acquisition stage "${value}".`);
 return values[key];
}
function nullableCsvNumber(value,label,{min=0,max=Number.MAX_SAFE_INTEGER}={}){
 if(value.trim()==='')return null;
 const number=Number(value);
 if(!Number.isFinite(number)||number<min||number>max)throw new Error(`${label} must be a number from ${min} to ${max}.`);
 return number;
}
function csvDate(value){
 if(!value.trim())return null;
 const date=value.trim();
 if(!/^\d{4}-\d{2}(-\d{2})?$/.test(date))throw new Error('Expected completion date must use YYYY-MM or YYYY-MM-DD.');
 const [year,month,day=1]=date.split('-').map(Number),parsed=new Date(Date.UTC(year,month-1,day));
 if(parsed.getUTCFullYear()!==year||parsed.getUTCMonth()!==month-1||parsed.getUTCDate()!==day)throw new Error('Expected completion date is invalid.');
 return date.length===7?`${date}-01`:date;
}
function csvValue(record,...keys){for(const key of keys)if(record[key]!==undefined&&record[key]!=='')return record[key];return '';}
function coordinatePair(latitudeValue,longitudeValue,label='Coordinates'){
 const latitude=nullableCsvNumber(latitudeValue,`${label} latitude`,{min:-90,max:90});
 const longitude=nullableCsvNumber(longitudeValue,`${label} longitude`,{min:-180,max:180});
 if((latitude===null)!==(longitude===null))throw new Error(`${label} require both latitude and longitude.`);
 return {latitude,longitude};
}
async function importProjectCsv(file){
 if(!supabaseClient||!currentUser)return toast('Please sign in before importing project data.');
 let parsed;
 try{parsed=parseCsv(await file.text());}catch(error){return toast(error.message);}
 const records=new Map(),errors=[];let duplicateRows=0;
 for(const {line,record} of parsed){
  try{
   const code=csvValue(record,'project_code','project_id','id').trim();
   if(!code||!/^[A-Za-z0-9_-]{1,40}$/.test(code))throw new Error('A valid project_code is required for deduplication.');
   const name=csvValue(record,'project_name','name').trim(),state=normalizePlace(csvValue(record,'state')),district=normalizePlace(csvValue(record,'district'));
   if(!name||!state||!district)throw new Error('Project name, state and district are required.');
   const status=normalizeStatus(csvValue(record,'status'));
   const stageValue=csvValue(record,'acquisition_stage','stage');
   const riskValue=csvValue(record,'risk_level','risk')||'Low';
   const risk=({low:'Low',medium:'Medium',high:'High',critical:'Critical'})[riskValue.toLowerCase()];
   if(!risk)throw new Error(`Unknown risk level "${riskValue}".`);
   const date=csvDate(csvValue(record,'expected_completion','expected_date','date'));
   const hasLatitudeHeader='latitude' in record||'lat' in record;
   const hasLongitudeHeader='longitude' in record||'lon' in record;
   if(hasLatitudeHeader!==hasLongitudeHeader)throw new Error('CSV must include both latitude and longitude columns together.');
   const coordinates=coordinatePair(csvValue(record,'latitude','lat'),csvValue(record,'longitude','lon'),`Line ${line} coordinates`);
   const verifiedValue=csvValue(record,'source_verified','verified').toLowerCase();
   if(verifiedValue&&!['true','false','yes','no','1','0'].includes(verifiedValue))throw new Error('source_verified must be true/false, yes/no or 1/0.');
   const payload={project_code:code,name,state,district,status,risk_level:risk,progress:nullableCsvNumber(csvValue(record,'progress'),`line ${line} progress`,{max:100})??0,expected_completion:date,...coordinates,acquisition_stage:stageValue?normalizeStage(stageValue):'Planning',compensation_completion:nullableCsvNumber(csvValue(record,'compensation_completion','compensation_progress'),`line ${line} compensation`,{max:100}),approval_delay_days:nullableCsvNumber(csvValue(record,'approval_delay_days','approval_delay'),`line ${line} approval delay`),dispute_count:nullableCsvNumber(csvValue(record,'dispute_count','disputes'),`line ${line} disputes`),possession_progress:nullableCsvNumber(csvValue(record,'possession_progress','possession'),`line ${line} possession`,{max:100}),rehabilitation_progress:nullableCsvNumber(csvValue(record,'rehabilitation_progress','rehabilitation'),`line ${line} rehabilitation`,{max:100}),historical_department_delay_days:nullableCsvNumber(csvValue(record,'historical_department_delay_days','department_delay_days'),`line ${line} historical delay`),source_name:csvValue(record,'source_name')||'Authorized CSV import',source_record_id:csvValue(record,'source_record_id')||code,source_verified:['true','yes','1'].includes(verifiedValue),source_updated_at:csvDate(csvValue(record,'source_updated_at'))};
   const key=code.toLowerCase();if(records.has(key))duplicateRows++;
   records.set(key,{line,payload,hasCoordinates:hasLatitudeHeader&&hasLongitudeHeader});
  }catch(error){errors.push(`Line ${line}: ${error.message}`);}
 }
 let imported=0,updated=0;
 for(const {line,payload,hasCoordinates} of records.values()){
  const existing=projects.find(project=>project.id.toLowerCase()===payload.project_code.toLowerCase());
  const savedPayload=existing&&!hasCoordinates?{...payload,latitude:existing.latitude,longitude:existing.longitude}:payload;
  const result=existing
   ?await supabaseClient.from('projects').update(savedPayload).eq('id',existing.dbId).select('id').single()
   :await supabaseClient.from('projects').insert({...savedPayload,created_by:currentUser.id}).select('id').single();
  if(result.error)errors.push(`Line ${line} (${payload.project_code}): ${result.error.message}`);
  else if(existing)updated++;else imported++;
 }
 await loadProjects();
 const summary=`CSV import finished: ${imported} added, ${updated} updated, ${duplicateRows} duplicate row(s) merged, ${errors.length} row(s) rejected or failed.`;
 if(errors.length)alert(`${summary}\n\n${errors.slice(0,8).join('\n')}${errors.length>8?'\nFurther errors omitted.':''}`);
 toast(summary);
}
