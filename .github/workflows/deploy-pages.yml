name: Deploy LandSetu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep production deployments serialized; do not cancel a deployment mid-flight.
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare static website
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html auth.js ai-predictions.js supabase-config.js _site/
          touch _site/.nojekyll

      - name: Validate deployment files
        run: |
          set -euo pipefail
          for file in index.html auth.js ai-predictions.js supabase-config.js; do
            test -s "_site/$file" || { echo "Missing deployment file: $file"; exit 1; }
          done
          grep -q "ai-predictions.js" _site/index.html
          node --check _site/auth.js
          node --check _site/ai-predictions.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
